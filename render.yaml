# Render Deployment Blueprint for ModelForge (AutoML)
services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend Service
  # -------------------------------------------------------------
  - type: web
    name: modelforge-backend
    env: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # By default, Render Free Tier has ephemeral storage. 
    # If using a paid tier ($7/mo Starter), you can uncomment the disk section below:
    # disk:
    #   name: modelforge-storage
    #   mountPath: /storage
    #   sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: OPENROUTER_API_KEY
        sync: false # Securely prompted during Render setup
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4-flash
      - key: OPENROUTER_REFERER
        value: https://modelforge.onrender.com
      - key: OPENROUTER_APP_TITLE
        value: ModelForge
      - key: STORAGE_DIR
        value: ./storage
      - key: LOG_LEVEL
        value: INFO
      - key: MODAL_WORKSPACE
        sync: false # Securely prompted (e.g., your-username)
      - key: MODAL_INFERENCE_APP
        value: modelforge-inference
      - key: MODAL_MODELS_VOLUME
        value: modelforge-models
      # Token authentication details for Modal deployments inside Render:
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false

  # -------------------------------------------------------------
  # 2. Next.js Frontend Service
  # -------------------------------------------------------------
  - type: web
    name: namtheg
    env: node
    plan: free
    rootDir: Frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      # The browser never calls the backend directly — it proxies through this
      # frontend's own /api/backend/* route (see Frontend/next.config.ts and
      # Frontend/lib/api.ts). Set BACKEND_URL PER ACCOUNT in the Render dashboard to
      # THAT account's backend PUBLIC url, e.g. https://modelforge-backend-xxxx.onrender.com.
      #
      # Why public and not Render's private network (fromService)? Free-tier web
      # services can SEND private-network requests but cannot RECEIVE them, so the
      # proxy must target the public URL.
      #
      # Read at build time, so after changing it use "Clear build cache & deploy".
      # sync:false stops the blueprint from overwriting your dashboard value on re-sync.
      - key: BACKEND_URL
        sync: false
