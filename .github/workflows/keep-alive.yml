name: Keep Alive

on:
  schedule:
    - cron: "*/5 * * * *"   # Every 5 minutes (GitHub minimum)
  workflow_dispatch:          # Allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -fsS --max-time 30 \
            https://modelforge-backend-wy4n.onrender.com/ \
            && echo "Backend alive" || echo "Backend ping failed (may be cold-starting)"

      - name: Ping frontend
        run: |
          curl -fsS --max-time 30 \
            https://namtheg.onrender.com/ \
            && echo "Frontend alive" || echo "Frontend ping failed"
