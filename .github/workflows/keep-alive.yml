name: Keep Alive

# Pings the Render backend so it does not hit the free tier's 15-minute idle
# spin-down (and the ~50s cold start that follows).
#
# BACKEND ONLY — do not add a frontend ping back here. The frontend is on Vercel
# now and needs no pinging, and more importantly: Render's 750 free instance-hours
# are pooled per WORKSPACE. Pinging two always-on free services burned ~1,460 h
# against that pool, exhausting it mid-month and suspending everything until the 1st.
#
# Budget with one service: 24 h x 31 days = 744 h, which fits under 750 h but only
# by ~6 h. That headroom is why a second free service cannot come back.
#
# Set the repo variable KEEPALIVE_BACKEND_URL (Settings > Secrets and variables >
# Actions > Variables) to your own backend URL; the fallback below is the default deploy.

on:
  schedule:
    - cron: "*/5 * * * *"   # Every 5 minutes — backup only, GitHub may delay up to 30 min
  workflow_dispatch:          # Allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        env:
          BACKEND_URL: ${{ vars.KEEPALIVE_BACKEND_URL || 'https://modelforge-backend-wy4n.onrender.com' }}
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 \
            "${BACKEND_URL%/}/health")
          echo "Backend HTTP status: $STATUS"
