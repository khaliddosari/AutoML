name: Keep Alive

on:
  schedule:
    - cron: "*/5 * * * *"   # Every 5 minutes — backup only, GitHub may delay up to 30 min
  workflow_dispatch:          # Allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 \
            https://modelforge-backend-wy4n.onrender.com/health)
          echo "Backend HTTP status: $STATUS"

      - name: Ping frontend
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 \
            https://namtheg.onrender.com/)
          echo "Frontend HTTP status: $STATUS"
